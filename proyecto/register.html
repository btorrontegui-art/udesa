<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <link href="./css/style.css" rel="stylesheet">
    <title> Proyecto Integrador</title>
</head>
<body>
    <header>
        <div class="marca">
            <a href="./index.html">
                <img src="./img/logo.png" class="logo">
            </a>
            <h1 class="titulo">Wax Wave</h1>
        </div>
        <form action="./search-results.html" method="get">
            <input type="text" name="search" value="" placeholder="Buscar productos...">
            <button type="submit">Buscar</button>
        </form>
        <nav class="menu">
            <ul class="registro">
                <li><a href="./index.html" class="pos">Home</a></li>
                <li><a href="./login.html" class="pos">Login</a></li>
                <li><a href="./registro.html" class="pos">Registro</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenido">
        <div class="login">
            <form action="./login.html" method="get" class="tarjeta-login">
                <h1>Crear cuenta</h1>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" value="" name="email" placeholder="tu@email.com">
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" value="" name="password" placeholder="......">
                </div>
                <div class="campo">
                    <label for="password2">Repetir contraseña</label>
                    <input type="password" id="password2" value="" name="password2" placeholder=".......">
                </div>
                <input type="checkbox" id="terminos" value="" name="terminos">
                <label for="terminos">Acepto términos y condiciones</label>
                <button type="submit">Registrarme</button>
                <a href="./login.html">Ya tengo una cuenta</a>
            </form>
        </div>
    </main>
    <footer>
        <p>© 2026 - Wax Wav</p>
        <p>Integrantes: Tiago Santos Gueudet - Benito Torrontegui</p>
    </footer>
</body>
</html>
